name: Environment bootstrap
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n run.sh
      - run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'opencv-python-headless>=4.8,<5'
      - run: python -m unittest tests.test_architecture tests.test_pipeline_guards tests.test_environment -v
      - run: python test_pipeline_mock.py
      - run: python test_app.py
