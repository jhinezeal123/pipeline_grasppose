name: Environment bootstrap
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n scripts/prepare.sh scripts/preprocess_prompt.sh scripts/cold.sh scripts/infer.sh scripts/get_output.sh scripts/space.sh
      - run: python -m py_compile env/setup_env.py env/check_env.py tools/validate_yoloe_fp32.py tools/validate_trt_parity.py tools/fetch_prebuilt_trt.py grasppose/worker_server.py grasppose/output_snapshot.py grasppose/output_renderer.py tools/output_control.py tools/infer_client.py tools/benchmark_infer.py
      - if: matrix.python-version == '3.8'
        run: >-
          python -m pip install
          'numpy==1.23.5'
          'scipy==1.10.1'
          'opencv-python==4.8.1.78'
          'pillow==10.4.0'
      - if: matrix.python-version == '3.12'
        run: >-
          python -m pip install
          'numpy>=1.24,<3'
          'scipy>=1.10,<2'
          'opencv-python-headless>=4.8,<5'
          'pillow>=10,<13'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python test_pipeline_mock.py
      - run: python test_app.py
