name: Environment bootstrap
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n scripts/prepare.sh scripts/preprocess_prompt.sh scripts/worker.sh scripts/infer.sh scripts/output.sh scripts/gradio.sh
      - run: python -m py_compile env/setup_env.py env/check_env.py scripts/build/preprocess_yoloe.py scripts/build/validate_yoloe.py scripts/build/validate_pipeline.py scripts/setup/fetch_prebuilt_trt.py grasppose/infrastructure/worker/server.py grasppose/infrastructure/output/snapshot.py grasppose/infrastructure/output/renderer.py grasppose/infrastructure/output/control.py grasppose/api.py apps/gradio/app.py apps/cli/infer.py
      - if: matrix.python-version == '3.8'
        run: >-
          python -m pip install
          'numpy==1.23.5'
          'scipy==1.10.1'
          'opencv-python==4.8.1.78'
          'pillow==10.4.0'
      - if: matrix.python-version == '3.12'
        run: >-
          python -m pip install
          'numpy>=1.24,<3'
          'scipy>=1.10,<2'
          'opencv-python-headless>=4.8,<5'
          'pillow>=10,<13'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m tests.test_pipeline_mock
      - run: python -m tests.test_app
