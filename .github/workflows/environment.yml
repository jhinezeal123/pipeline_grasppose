name: Environment bootstrap
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n run.sh
      # numpy phai cai TRUOC buoc unittest: tests/test_pipeline_guards.py import
      # pipeline.py, ma pipeline.py can numpy. Cac test con lai chi test shell va
      # chuoi nen khong can gi. CI co tinh khong cai torch/CUDA — day la test
      # logic thuan, khong can GPU hay model.
      #
      # test_pipeline_mock.py va test_app.py nam o thu muc GOC repo (khong phai
      # tests/) va KHONG dung unittest — 'discover -s tests' khong bao gio chay
      # chung. Chung la script tu chay, in 'TAT CA MUC DEU PASS' va exit 0; chay
      # truc tiep de exit code khac 0 lam CI fail.
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v
      - run: python test_pipeline_mock.py
      - run: python test_app.py
