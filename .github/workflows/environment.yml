name: Environment bootstrap
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n run.sh
      # numpy + opencv-python-headless phai cai TRUOC buoc unittest:
      # tests/test_pipeline_guards.py import pipeline.py, ma pipeline.py can numpy
      # va draw_grasp() can cv2. Cac test con lai chi test shell va chuoi nen khong
      # can gi. CI co tinh KHONG cai torch/CUDA — day la test logic thuan, chay
      # duoc tren may khong GPU.
      #
      # Port Jetson dung NumPy/OpenCV tu JetPack host. CI dung ban gan voi
      # baseline Xavier de bat loi Python 3.8 thay vi kiem thu stack Kaggle moi.
      #
      # test_pipeline_mock.py va test_app.py nam o thu muc GOC repo (khong phai
      # tests/) va KHONG dung unittest — 'discover -s tests' khong bao gio chay
      # chung. Chung la script tu chay, in 'TAT CA MUC DEU PASS' va exit 0; chay
      # truc tiep de exit code khac 0 lam CI fail.
      - run: python -m pip install 'numpy==1.23.5' 'opencv-python-headless==4.5.5.64'
      - run: python -m unittest discover -s tests -v
      - run: python test_pipeline_mock.py
      - run: python test_app.py
