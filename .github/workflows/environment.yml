name: Environment bootstrap
on: [push, pull_request]
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.8'
            test-deps: >-
              numpy==1.23.5 scipy==1.10.1 opencv-python==4.8.1.78
          - python-version: '3.12'
            test-deps: >-
              numpy>=1.24,<3 scipy>=1.10,<2 opencv-python-headless>=4.8,<5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash -n prepare.sh infer.sh space.sh
      - run: python -m py_compile env/setup_env.py env/check_env.py
      - run: python -m pip install ${{ matrix.test-deps }}
      - run: python -m unittest tests.test_architecture tests.test_pipeline_guards tests.test_environment -v
      - run: python test_pipeline_mock.py
      - run: python test_app.py
